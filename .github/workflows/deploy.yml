name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check formatting and template wiring
        run: |
          npm run lint:prettier
          npm run lint:style-contract
          bundle exec al-folio upgrade audit --no-fail
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Build the website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Check rendered pages and publication authors
        run: bundle exec ruby bin/check_site.rb
      - name: Save the rendered website for review
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
          retention-days: 7
      - name: Package the GitHub Pages website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
